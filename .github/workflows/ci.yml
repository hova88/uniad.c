name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build and C tests
        run: make test-core
      - name: CMake parity
        run: cmake -S . -B build-cmake -DUNIAD_CUDA=OFF && cmake --build build-cmake && ctest --test-dir build-cmake --output-on-failure
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy && pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: |
          make
          UA_TEST_CLI=build/cpu/uniad python3 tests/test_uaw2.py
          python3 tools/oracle.py --compare build/cpu/uniad --asset-dir build/oracle-demo
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python3 tools/validate_site.py && python3 tools/verify_provenance.py
