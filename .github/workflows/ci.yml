name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build and C tests
        run: |
          make
          cc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc tests/test_runtime.c build/uniad.o build/operators.o -lm -o build/test_runtime
          build/test_runtime
          python3 tests/test_cli.py
      - name: CMake parity
        run: cmake -S . -B build-cmake -DUNIAD_CUDA=OFF && cmake --build build-cmake && ctest --test-dir build-cmake --output-on-failure
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: make && python3 tools/oracle.py --compare build/uniad --asset-dir build/oracle-demo
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python3 tools/validate_site.py && python3 tools/verify_provenance.py
